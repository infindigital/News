# Local/production orchestration: PostgreSQL + Strapi CMS + Next.js frontend.
# Usage: cp backend/.env.example backend/.env && docker compose up --build
services:
  postgres:
    image: postgres:16-alpine
    container_name: news_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-news_portal}
      POSTGRES_USER: ${DATABASE_USERNAME:-strapi}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-strapi}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DATABASE_USERNAME:-strapi}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - news_net

  cms:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: news_cms
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:-news_portal}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-strapi}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-strapi}
    ports:
      - '1337:1337'
    volumes:
      - uploads_data:/opt/app/public/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - news_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: news_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_STRAPI_URL: http://cms:1337
      NEXT_PUBLIC_STRAPI_API_URL: http://cms:1337/api
      NEXT_PUBLIC_STRAPI_GRAPHQL_URL: http://cms:1337/graphql
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      NEXT_PUBLIC_USE_MOCK_FALLBACK: 'false'
    ports:
      - '3000:3000'
    depends_on:
      - cms
    networks:
      - news_net

volumes:
  postgres_data:
  uploads_data:

networks:
  news_net:
    driver: bridge
